# ==========================================
# Hytale Survival Games - Main Configuration
# ==========================================

# Plugin settings
settings:
  # Enable debug messages
  debug: false

  # Broadcast messages to entire server
  broadcast-game-start: true
  broadcast-game-end: true

  # Auto-join settings
  auto-join-enabled: false
  auto-join-arena: "default"

# Game settings (global defaults)
game:
  # Default minimum players to start
  min-players: 2

  # Default maximum players per arena
  max-players: 24

  # Default game time in seconds
  game-time: 600

  # Time until deathmatch starts (in seconds)
  deathmatch-time: 300

  # Border shrink radius for deathmatch
  border-shrink-radius: 50

  # Countdown time before game starts
  countdown-time: 10

  # Time before arena resets after game ends
  reset-delay: 10

# Player settings
player:
  # Clear inventory on join
  clear-inventory: true

  # Restore inventory on leave
  restore-inventory: true

  # Health on game start
  starting-health: 20

  # Food level on game start
  starting-food: 20

  # Allow spectating after death
  allow-spectating: true

# Loot settings
loot:
  # Enable loot spawning
  enabled: true

  # Refill chests during deathmatch
  refill-on-deathmatch: false

  # Loot tier distribution (percentage)
  tier-weights:
    basic: 70
    tier2: 30

# Messages
messages:
  prefix: "§8[§6SG§8]§r "

  game-starting: "{prefix}§eGame starting in §6{time} §eseconds..."
  game-started: "{prefix}§aThe game has begun! May the odds be ever in your favor!"
  game-ended: "{prefix}§cThe game has ended!"

  player-joined: "{prefix}§a{player} joined the game! ({current}/{max})"
  player-left: "{prefix}§c{player} left the game! ({current}/{max})"
  player-eliminated: "{prefix}§c{player} has been eliminated! §e{remaining} §7players remaining."

  winner-announcement: "{prefix}§6§l{player} WINS!"

  deathmatch-started: "{prefix}§c§lDEATHMATCH! §7The border is shrinking!"

  not-in-game: "{prefix}§cYou are not in a game!"
  already-in-game: "{prefix}§cYou are already in a game!"
  arena-full: "{prefix}§cThis arena is full!"
  arena-in-progress: "{prefix}§cThis game is already in progress!"
  no-permission: "{prefix}§cYou don't have permission to do that!"

# Database settings (for stats tracking - optional)
database:
  enabled: false
  type: "sqlite"
  host: "localhost"
  port: 3306
  database: "survivalgames"
  username: "root"
  password: ""
