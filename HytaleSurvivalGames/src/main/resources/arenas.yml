# ==========================================
# Hytale Survival Games - Arenas Configuration
# ==========================================
# Define your Survival Games arenas here
# Each arena must have unique spawn points and chest locations

arenas:
  # Example Arena 1 - Default Arena
  default:
    # Display name shown to players
    displayName: "§6Classic Arena"

    # World name
    world: "world"

    # Arena boundaries (cuboid region)
    # Corner 1 and Corner 2 define the arena's boundaries
    corner1:
      x: 0
      y: 60
      z: 0

    corner2:
      x: 200
      y: 100
      z: 200

    # Lobby spawn point (where players wait before game starts)
    lobby:
      x: 100
      y: 65
      z: 100
      yaw: 0
      pitch: 0

    # Player spawn points (at least as many as maxPlayers)
    # Players will be randomly assigned to these points at game start
    spawnPoints:
      - x: 80
        y: 65
        z: 80
        yaw: 45
        pitch: 0

      - x: 120
        y: 65
        z: 80
        yaw: 135
        pitch: 0

      - x: 120
        y: 65
        z: 120
        yaw: 225
        pitch: 0

      - x: 80
        y: 65
        z: 120
        yaw: 315
        pitch: 0

      - x: 100
        y: 65
        z: 70
        yaw: 90
        pitch: 0

      - x: 130
        y: 65
        z: 100
        yaw: 180
        pitch: 0

      - x: 100
        y: 65
        z: 130
        yaw: 270
        pitch: 0

      - x: 70
        y: 65
        z: 100
        yaw: 0
        pitch: 0

      - x: 90
        y: 65
        z: 90
        yaw: 45
        pitch: 0

      - x: 110
        y: 65
        z: 90
        yaw: 135
        pitch: 0

      - x: 110
