        z: 110
        yaw: 225
        pitch: 0

      - x: 90
        y: 65
        z: 110
        yaw: 315
        pitch: 0

    # Chest locations for loot spawning
    chestLocations:
      # Center chests (high value)
      - x: 100
        y: 65
        z: 100

      - x: 102
        y: 65
        z: 100

      - x: 98
        y: 65
        z: 100

      # Outer chests
      - x: 75
        y: 65
        z: 75

      - x: 125
        y: 65
        z: 75

      - x: 125
        y: 65
        z: 125

      - x: 75
        y: 65
        z: 125

      - x: 100
        y: 65
        z: 65

      - x: 135
        y: 65
        z: 100

      - x: 100
        y: 65
        z: 135

      - x: 65
        y: 65
        z: 100

      # Additional scattered chests
      - x: 85
        y: 65
        z: 85

      - x: 115
        y: 65
        z: 85

      - x: 115
        y: 65
        z: 115

      - x: 85
        y: 65
        z: 115

    # Arena-specific settings
    minPlayers: 2
    maxPlayers: 12
    gameTime: 600        # 10 minutes
    deathmatchTime: 420  # 7 minutes (deathmatch at 3 min remaining)
    borderShrinkRadius: 40

